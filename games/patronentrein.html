<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Patronentrein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen canvas (wooden floor, play mat with a wooden track, the train, the toy box at the bottom); sound button top-right; title card on top */
:root{
  --ink:#4a2a14;
  --floor:#b97f49;
  --paper:#fff3dc;
  --gold:#ffcd38;
  --accent:#e2553a;
  --font-display:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  color-scheme: light;
}
html,body{margin:0;height:100%}
body{background:var(--floor);color:var(--ink);overflow:hidden;font-family:var(--font-display);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px}
.btn{width:60px;height:60px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.btn svg{width:30px;height:30px}
.title{position:fixed;left:0;right:0;top:calc(14% + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .6s,transform .6s}
.title h1{margin:0;font-weight:800;font-size:clamp(40px,10vw,90px);line-height:1;color:var(--gold);letter-spacing:.01em;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.title p{margin:0;font-size:clamp(20px,3.4vw,28px);font-weight:800;line-height:1.1;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);border-radius:30px;padding:10px 22px 8px}
.title small{font-size:clamp(15px,2.2vw,19px);font-weight:700;color:#fff3dc;max-width:32ch;text-wrap:balance;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}
.title.gone{opacity:0;transform:translateY(-24px)}
@media (prefers-reduced-motion:reduce){.title{transition:opacity .4s}.title.gone{transform:none}}
</style>
</head>
<body>
<canvas id="game" role="img" aria-label="Een houten treintje met blokjes in een patroon. Sleep het juiste blokje uit de speelgoedkist op de lege wagon; tik op de lege wagon om het patroon te horen."></canvas>
<div class="title" id="title">
  <h1>Patronentrein</h1>
  <p>Tik om te beginnen</p>
  <small>Sleep het juiste blokje op de lege wagon. Tik op de lege wagon om het patroon te horen.</small>
</div>
<div class="hud">
  <button class="btn" id="sound" type="button" aria-label="Geluid staat aan" aria-pressed="true"></button>
</div>

<script>
(() => {
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('game'), c=cv.getContext('2d');
const titleEl=document.getElementById('title'), soundBtn=document.getElementById('sound');
const P=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,e)=>a+(b-a)*e;
const ease=e=>e*e*(3-2*e);
const easeOut=e=>1-Math.pow(1-e,3);
const backOut=e=>{ const s=RM?0:1.7; return 1+(s+1)*Math.pow(e-1,3)+s*Math.pow(e-1,2); };
const frac=v=>v-Math.floor(v);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let sd=7; const srand=()=>((sd=(sd*16807)%2147483647)-1)/2147483646; // seeded, so the textures look the same every time

function shade(hex,k){ const n=parseInt(hex.slice(1),16); const f=v=>Math.round(clamp(v*k,0,255)); return 'rgb('+f(n>>16)+','+f((n>>8)&255)+','+f(n&255)+')'; }

/* ---------- wood textures (drawn once) ---------- */
// grain: dark wavy streaks around a few knots on a transparent tile; speck: light dots where the paint wore off.
// Both tiles are seamless, and they are laid over painted shapes as patterns.
function makeGrain(n){
  const g=document.createElement('canvas'); g.width=g.height=n; const x=g.getContext('2d');
  const knots=[]; for(let i=0;i<3;i++) knots.push({x:srand()*n,y:srand()*n,r:10+srand()*14});
  x.lineCap='round';
  for(let i=0;i<80;i++){
    const y0=srand()*n, amp=1.5+srand()*5, f=1+Math.floor(srand()*3), ph=srand()*P;
    x.strokeStyle='rgba(70,35,10,'+(0.05+srand()*0.22).toFixed(3)+')'; x.lineWidth=0.6+srand()*2.2;
    for(const dy of [-n,0,n]){
      x.beginPath();
      for(let px=0;px<=n;px+=8){
        let py=y0+dy+Math.sin(px/n*P*f+ph)*amp;
        for(const k of knots) for(const kx of [k.x-n,k.x,k.x+n]){ const ddx=px-kx, ddy=py-k.y; py+=(ddy<0?-1:1)*k.r*1.3*Math.exp(-(ddx*ddx*0.25+ddy*ddy)/(k.r*k.r*4)); }
        if(px) x.lineTo(px,py); else x.moveTo(px,py);
      }
      x.stroke();
    }
  }
  for(const k of knots) for(const kx of [k.x-n,k.x,k.x+n]) for(const ky of [k.y-n,k.y,k.y+n]){
    x.strokeStyle='rgba(70,35,10,0.2)'; x.lineWidth=1.3;
    for(let r=k.r;r>2;r-=3.2){ x.beginPath(); x.ellipse(kx,ky,r*1.7,r*0.65,0,0,P); x.stroke(); }
    x.fillStyle='rgba(60,28,8,0.4)'; x.beginPath(); x.ellipse(kx,ky,k.r*0.4,k.r*0.2,0,0,P); x.fill();
  }
  return g;
}
function makeSpeck(n){
  const g=document.createElement('canvas'); g.width=g.height=n; const x=g.getContext('2d');
  for(let i=0;i<140;i++){
    const px=srand()*n, py=srand()*n, r=0.4+srand()*1.4;
    x.fillStyle='rgba(255,238,205,'+(0.15+srand()*0.45).toFixed(3)+')';
    for(const dx of [-n,0,n]) for(const dy of [-n,0,n]){ x.beginPath(); x.ellipse(px+dx,py+dy,r*(1+srand()),r,srand()*3,0,P); x.fill(); }
  }
  return g;
}
const GRAIN=makeGrain(512), SPECK=makeSpeck(256);
function pats(ctx){ return {grain:{p:ctx.createPattern(GRAIN,'repeat'),n:512}, speck:{p:ctx.createPattern(SPECK,'repeat'),n:256}}; }
const PAT=pats(c);
// fill a rect with a texture tile scaled to T px, shifted by seed o (and optionally rotated, in degrees)
function patFill(ctx,pt,x,y,w,h,T,o,alpha,rot){
  if(!pt.p) return;
  try{
    const m=new DOMMatrix().translateSelf(x-frac(o*0.618)*T,y-frac(o*0.382)*T);
    if(rot) m.rotateSelf(rot);
    m.scaleSelf(T/pt.n,T/pt.n); pt.p.setTransform(m);
  }catch(e){}
  ctx.globalAlpha=alpha; ctx.fillStyle=pt.p; ctx.fillRect(x,y,w,h); ctx.globalAlpha=1;
}
const dashCache={};
function dashFor(o,bev){
  const k=Math.abs(o|0)+1;
  if(!dashCache[k]){ let s=k*7919; const r=()=>((s=(s*16807)%2147483647)/2147483647); const a=[]; for(let i=0;i<6;i++) a.push(0.5+r()*1.6,3+r()*11); dashCache[k]=a; }
  return dashCache[k].map(v=>v*bev);
}

/* ---------- drawing helpers ---------- */
function rrPath(x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
const rr=(x,y,w,h,r)=>()=>{ c.beginPath(); rrPath(x,y,w,h,r); };
const circ=(x,y,r)=>()=>{ c.beginPath(); c.arc(x,y,r,0,P); };
function roundPoly(pts,r){
  const n=pts.length, a=pts[n-1], b=pts[0];
  c.moveTo((a[0]+b[0])/2,(a[1]+b[1])/2);
  for(let i=0;i<n;i++){ const p=pts[i], q=pts[(i+1)%n]; c.arcTo(p[0],p[1],q[0],q[1],r); }
  c.closePath();
}
// one painted (or natural) wooden piece: paint, grain, worn specks, rounded-edge bevel, chipped edges, thin dark edge
function wood(path,x,y,w,h,col,o,opt={}){
  const bev=opt.bev||Math.max(1.2,Math.min(w,h)*0.07);
  if(opt.shadow){ c.save(); c.translate(opt.shadow*0.35,opt.shadow); path(); c.fillStyle='rgba(55,25,5,0.25)'; c.fill(); c.restore(); }
  path(); c.fillStyle=col; c.fill();
  const worn=opt.worn!==false;
  c.save(); path(); c.clip();
  patFill(c,PAT.grain,x,y,w,h,opt.T||B*3,o,opt.grain!=null?opt.grain:0.28,opt.rot);
  if(worn) patFill(c,PAT.speck,x,y,w,h,B*1.3,o+3,0.55);
  c.lineWidth=bev*2; c.lineJoin='round';
  c.save(); c.translate(bev,bev); path(); c.strokeStyle='rgba(255,250,232,0.34)'; c.stroke(); c.restore();
  c.save(); c.translate(-bev,-bev); path(); c.strokeStyle='rgba(60,25,0,0.24)'; c.stroke(); c.restore();
  if(worn){ c.setLineDash(dashFor(o,bev)); path(); c.strokeStyle='rgba(238,210,165,0.6)'; c.lineWidth=bev*1.1; c.stroke(); c.setLineDash([]); }
  c.restore();
  path(); c.strokeStyle='rgba(70,35,10,0.55)'; c.lineWidth=Math.max(1,bev*0.4); c.stroke();
}

/* ---------- blocks ---------- */
const COLS=['red','blue','yellow','green'], SHAPES=['circle','square','triangle','star'];
const PAINT={red:'#dc3a2e',blue:'#2f6bcf',yellow:'#f4bf1f',green:'#37a04a'};
const NOTES=[523.25,587.33,659.25]; // do, re, mi: one note per pattern element
const key=it=>it.col+'-'+it.shape;
const same=(a,b)=>a&&b&&a.col===b.col&&a.shape===b.shape;
function shapePath(sh,s){
  c.beginPath();
  if(sh==='circle') c.arc(0,0,s*0.47,0,P);
  else if(sh==='square') rrPath(-s*0.43,-s*0.43,s*0.86,s*0.86,s*0.13);
  else if(sh==='triangle') roundPoly([[0,-s*0.5],[s*0.55,s*0.44],[-s*0.55,s*0.44]],s*0.09);
  else { const pts=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, r=i%2?s*0.25:s*0.55; pts.push([Math.cos(a)*r,Math.sin(a)*r+s*0.05]); } roundPoly(pts,s*0.045); }
}
function drawBlock(it,x,y,s,o={}){
  c.save(); c.translate(x,y); if(o.rot) c.rotate(o.rot);
  if(o.alpha!=null) c.globalAlpha=o.alpha;
  if(o.glow>0){
    const g=c.createRadialGradient(0,0,s*0.2,0,0,s*0.95);
    g.addColorStop(0,'rgba(255,244,160,'+(0.9*o.glow).toFixed(3)+')'); g.addColorStop(1,'rgba(255,244,160,0)');
    c.fillStyle=g; c.beginPath(); c.arc(0,0,s*0.95,0,P); c.fill();
  }
  if(o.lift){ c.save(); c.translate(o.lift*0.3,o.lift); shapePath(it.shape,s); c.fillStyle='rgba(55,25,5,0.22)'; c.fill(); c.restore(); }
  // thickness: the block's side, stacked up and to the right
  const d=s*0.1, col=PAINT[it.col];
  c.fillStyle=shade(col,0.62);
  for(let k=4;k>=1;k--){ c.save(); c.translate(d*k/4,-d*k/4); shapePath(it.shape,s); c.fill(); c.restore(); }
  c.save(); c.translate(d,-d); shapePath(it.shape,s); c.strokeStyle='rgba(60,25,5,0.45)'; c.lineWidth=Math.max(1,s*0.025); c.stroke(); c.restore();
  wood(()=>shapePath(it.shape,s),-s/2,-s/2,s,s,col,COLS.indexOf(it.col)*5+SHAPES.indexOf(it.shape)+1,{T:s*2.4,grain:0.24});
  c.restore();
}

/* ---------- layout ---------- */
// B is the wagon unit; C is the size of a block in the toy box.
let W=0,H=0,DPR=1,PK=1.12,B=60,S=48,pitch=67,trackY=0,C=80,boxBot=0,lipTop=0,candY=0,boxTop=0,trayX=0,trayW=0;
const maxN=()=>W<600?5:6;
function layout(){
  const N=train?train.N:maxN();
  C=Math.max(50,Math.min(W*0.2,H*0.15,130,(W-28)/5.4));
  boxBot=H-Math.max(14,H*0.025);
  lipTop=boxBot-C*0.48; candY=lipTop-C*0.5; boxTop=candY-C*0.68;
  trayW=Math.min(W-20,C*5.4); trayX=(W-trayW)/2;
  PK=W<600?1.03:1.12; // narrow phones: wagons closer together, so the blocks stay bigger
  B=Math.min(H*0.14,(W-24)/(1.62+N*PK),(boxTop-90)/2.6);
  S=B*0.8; pitch=B*PK;
  const top=74, bot=boxTop-B*0.4;
  trackY=top+B*1.8+Math.max(0,bot-top-B*2.3)*0.55;
}
const trainW=tr=>pitch*tr.N+B*1.62;
const xStop=()=>(W-trainW(train))/2;
const wx=i=>train.x+pitch*(i+0.5);
const locoX=()=>train.x+pitch*train.N+B*0.06;
const bedTop=()=>trackY-B*0.46;
const blockPos=i=>({x:wx(i)-S*0.05,y:bedTop()-S/2});

/* ---------- floor (cached) ---------- */
let floorCv=null;
function buildFloor(){
  floorCv=document.createElement('canvas'); floorCv.width=Math.round(W*DPR); floorCv.height=Math.round(H*DPR);
  const f=floorCv.getContext('2d'), fp=pats(f); f.setTransform(DPR,0,0,DPR,0,0);
  const ph=clamp(H/7,60,120), tones=['#c48a52','#b87d47','#cc9661','#b47744','#c08550'];
  sd=11;
  for(let y=-ph*0.3,row=0;y<H;y+=ph,row++){
    let x=-srand()*ph*4;
    while(x<W){
      const len=ph*(3+srand()*4);
      f.fillStyle=tones[Math.floor(srand()*tones.length)]; f.fillRect(x,y,len,ph);
      f.save(); f.beginPath(); f.rect(x,y,len,ph); f.clip(); patFill(f,fp.grain,x,y,len,ph,ph*3.2,row*3+x*0.01,0.42); f.restore();
      f.fillStyle='rgba(255,235,200,0.18)'; f.fillRect(x,y+1,len,2);
      f.fillStyle='rgba(60,30,10,0.55)'; f.fillRect(x,y,2,ph);
      f.fillStyle='rgba(60,30,10,0.35)';
      for(const ny of [y+ph*0.25,y+ph*0.75]){ f.beginPath(); f.arc(x+ph*0.18,ny,2.2,0,P); f.fill(); }
      x+=len;
    }
    f.fillStyle='rgba(60,30,10,0.55)'; f.fillRect(0,y-1,W,2);
  }
  const g=f.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.3,W/2,H*0.45,Math.max(W,H)*0.85);
  g.addColorStop(0,'rgba(40,15,0,0)'); g.addColorStop(1,'rgba(40,15,0,0.35)');
  f.fillStyle=g; f.fillRect(0,0,W,H);
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  layout(); buildFloor();
}

/* ---------- sound ---------- */
let AC=null, soundOn=true, noiseBuf=null, master=null;
function ac(){
  if(!AC){
    // iPhone: play like a media app, so the silent switch doesn't mute the game
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    // iPhone: play one silent sample inside the first tap to unlock audio
    try{ const b=AC.createBuffer(1,1,22050), s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0); }catch(e){}
  }
  if(AC.state!=='running') AC.resume().catch(()=>{});
  return AC;
}
['touchend','click'].forEach(ev=>document.addEventListener(ev,()=>ac(),{passive:true}));
function out(){
  const a=ac(); if(!a) return null;
  if(!master){ master=a.createGain(); master.gain.value=soundOn?1:0; master.connect(a.destination); }
  return master;
}
function setMaster(on){ if(master&&AC) master.gain.setTargetAtTime(on?1:0,AC.currentTime,0.08); }
const live=()=>soundOn&&started; // the first train arrives behind the title card, silently
function tone(freq,start,dur,type='sine',vol=0.2,slideTo){
  if(!live()) return; const a=ac(), m=out(); if(!a||!m) return;
  const t0=a.currentTime+start, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(m); o.start(t0); o.stop(t0+dur+0.05);
}
function noise(start,dur,vol,f0,f1,q=1){
  if(!live()) return; const a=ac(), m=out(); if(!a||!m) return;
  if(!noiseBuf){ noiseBuf=a.createBuffer(1,a.sampleRate,a.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t0=a.currentTime+start, s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=noiseBuf; f.type='bandpass'; f.Q.value=q; f.frequency.setValueAtTime(f0,t0);
  if(f1) f.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f).connect(g).connect(m); s.start(t0); s.stop(t0+dur+0.05);
}
// a wooden xylophone bar: soft fundamental, a quick high partial and a tiny mallet click
function xylo(f,start=0,vol=0.22){ tone(f,start,0.7,'sine',vol); tone(f*3.9,start,0.08,'sine',vol*0.25); tone(f*2,start,0.22,'triangle',vol*0.12); noise(start,0.02,vol*0.5,f*3,null,2); }
// train whistle: three detuned saws through a lowpass, sliding up into pitch, with a bit of breath
function whistle(start,dur){
  if(!live()) return; const a=ac(), m=out(); if(!a||!m) return;
  const t0=a.currentTime+start, g=a.createGain(), f=a.createBiquadFilter();
  f.type='lowpass'; f.frequency.value=2000;
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.1,t0+0.05); g.gain.setValueAtTime(0.1,t0+dur-0.08); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  f.connect(g).connect(m);
  for(const fr of [494,622,740]){
    const o=a.createOscillator(), og=a.createGain(); o.type='sawtooth';
    o.frequency.setValueAtTime(fr*0.93,t0); o.frequency.exponentialRampToValueAtTime(fr,t0+0.09);
    og.gain.value=0.33; o.connect(og).connect(f); o.start(t0); o.stop(t0+dur+0.05);
  }
  noise(start,dur,0.04,2600);
}
const SFX={
  clack(){ noise(0,0.035,0.3,2400,null,2); tone(1250,0,0.06,'triangle',0.12,900); },
  softClack(){ noise(0,0.03,0.16,2000,null,2); tone(900,0,0.05,'triangle',0.07,700); },
  tok(){ tone(330,0,0.16,'sine',0.35,230); noise(0,0.05,0.18,900,null,2); tone(660,0,0.05,'triangle',0.06); },
  lift(){ tone(700,0,0.06,'triangle',0.08,950); noise(0,0.02,0.1,3000); },
  pop(i){ tone(520+i*80,0,0.1,'sine',0.12,820+i*80); noise(0,0.03,0.14,2200,null,2); },
  choo(){ whistle(0,0.22); whistle(0.3,0.5); },
  toot(){ whistle(0,0.32); },
  chuff(v){ noise(0,0.14,0.15*v,900,300,0.8); },
  hiss(){ noise(0,0.7,0.06,5000,3000); },
  ask(){ tone(440,0,0.12,'sine',0.13,520); tone(560,0.13,0.18,'sine',0.13,720); },
  tada(){ [523,659,784,1047].forEach((f,i)=>xylo(f,i*0.07,0.16)); [523,659,784].forEach(f=>xylo(f,0.32,0.1)); },
  boop(){ tone(240,0,0.09,'sine',0.16,180); noise(0,0.03,0.08,700,null,2); },
};

/* ---------- trains and levels ---------- */
// Levels: 1 AB colour, 2 AB shape, 3 AAB/ABB, 4 ABC, 5 colour + shape, 6 the gap in the middle.
// 3 trains without a mistake = one level up; 3 mistakes on a level = one level down (applied when the train leaves).
const UNITS={AB:[0,1],AAB:[0,0,1],ABB:[0,1,1],ABC:[0,1,2]};
const LOCOS=[{body:'#d8392b',cab:'#2e62c6',roof:'#f3c228'},{body:'#2e62c6',cab:'#f3c228',roof:'#d8392b'},{body:'#3a9c4d',cab:'#d8392b',roof:'#f3c228'},{body:'#f3c228',cab:'#3a9c4d',roof:'#2e62c6'}];
let level=1, clean=0, slips=0, trainNo=0;
let train=null, cands=[];
function makeTrain(){
  let lv=level, middle=false;
  if(lv===6){ middle=true; lv=pick([1,2,3,3,4,4,5,5]); }
  let dim, unit;
  if(lv===1){ dim='color'; unit='AB'; }
  else if(lv===2){ dim='shape'; unit='AB'; }
  else if(lv===3){ dim=pick(['color','shape']); unit=pick(['AAB','ABB']); }
  else if(lv===4){ dim=pick(['color','shape']); unit='ABC'; }
  else { dim='both'; unit=pick(['AB','AB','AAB','ABB','ABC']); }
  const u=UNITS[unit], k=Math.max(...u)+1, cols=shuffle(COLS.slice()), shapes=shuffle(SHAPES.slice());
  let E;
  if(dim==='color'){ const sh=pick(SHAPES); E=cols.slice(0,k).map(col=>({col,shape:sh})); }
  else if(dim==='shape'){ const col=pick(COLS); E=shapes.slice(0,k).map(shape=>({col,shape})); }
  else E=Array.from({length:k},(_,i)=>({col:cols[i],shape:shapes[i]}));
  const N=maxN(), seq=Array.from({length:N},(_,i)=>E[u[i%u.length]]);
  let gaps;
  if(middle){ gaps=[1+Math.floor(Math.random()*(N-2))]; if(gaps[0]<N-2&&Math.random()<0.35) gaps.push(N-1); }
  else { gaps=[N-1]; if(level>=3&&Math.random()<0.3) gaps=[N-2,N-1]; }
  // the toy box: every pattern block, a second copy if two gaps need the same one, then look-alikes
  const total=level<=2?3:4, items=E.slice(), needs=gaps.map(g=>seq[g]);
  for(const e of E){ const n=needs.filter(it=>same(it,e)).length; for(let i=1;i<n;i++) items.push(e); }
  let pool;
  if(dim==='color') pool=cols.slice(k).map(col=>({col,shape:E[0].shape}));
  else if(dim==='shape') pool=shapes.slice(k).map(shape=>({col:E[0].col,shape}));
  else { pool=[]; for(let i=0;i<k;i++) for(let j=0;j<k;j++) if(i!==j) pool.push({col:E[i].col,shape:E[j].shape}); shuffle(pool); }
  while(items.length<total&&pool.length) items.push(pool.shift());
  shuffle(items);
  const tr={N,E,st:'arrive',t:0,x:0,v:0,dist:0,lastChuff:0,mist:0,step:-1,tada:false,puffT:1,loco:LOCOS[trainNo++%LOCOS.length],
    wagons:seq.map((it,i)=>({need:it,it:gaps.includes(i)?null:it,bounce:0,shake:0,glow:0,q:0,res:false}))};
  return {tr,items};
}
function newTrain(){
  const {tr,items}=makeTrain();
  train=tr; layout();
  train.xs=-trainW(train)-30; train.x=train.xs;
  cands=items.map((it,i)=>({it,slot:i,st:'in',appear:-1e9,out:0,wob:0,anim:null}));
  selected=null; drag=null; hint=null; gapMist=0; idle=0;
}
const elemIdx=it=>train.E.findIndex(e=>same(e,it));
const firstNeed=()=>{ const w=train.wagons.find(w=>!w.it); return w?w.need:null; };

/* ---------- candidates (blocks in the toy box) ---------- */
let selected=null, drag=null, hint=null, gapMist=0, idle=0, hover=-1;
function homePos(cd){
  const p=(trayW-C*0.4)/cands.length;
  return {x:trayX+C*0.2+p*(cd.slot+0.5),y:candY};
}
const dragSize=y=>lerp(C,S,clamp((boxTop-y)/Math.max(1,boxTop-(trackY-B*0.9)),0,1));
function candPos(cd){
  if(cd.st==='drag') return {x:drag.x+drag.ox,y:drag.y+drag.oy,s:dragSize(drag.y+drag.oy),rot:0};
  if(cd.st==='anim'){ const a=cd.anim, e=ease(Math.min(1,a.t/a.dur)); return {x:lerp(a.x0,a.x1,e),y:lerp(a.y0,a.y1,e)-Math.sin(e*Math.PI)*a.arc,s:lerp(a.s0,a.s1,e),rot:0}; }
  const h=homePos(cd); let y=h.y;
  if(cd===selected) y-=C*0.16;
  if(gapMist>=2&&train.st==='wait'&&same(cd.it,firstNeed())) y-=Math.abs(Math.sin(t*5))*C*(RM?0.05:0.12);
  const e=clamp(cd.appear,0,1);
  return {x:h.x,y,s:C*backOut(e)*(1-cd.out),rot:Math.sin(t*22)*0.3*cd.wob*(RM?0.3:1)};
}
function animate(cd,x1,y1,s1,dur,arc,done){
  const p=candPos(cd); cd.anim={x0:p.x,y0:p.y,s0:p.s,x1,y1,s1,t:0,dur,arc,done}; cd.st='anim';
}
function goHome(cd,wrong){
  const h=homePos(cd);
  animate(cd,h.x,h.y,C,wrong?0.55:0.3,wrong?B*1.1:C*0.25,()=>{ cd.st='in'; if(wrong) cd.wob=1; SFX.softClack(); });
}
function findTarget(x,y){
  if(!train||train.st!=='wait') return -1;
  const open=train.wagons.map((w,i)=>i).filter(i=>!train.wagons[i].it&&!train.wagons[i].res);
  const reach=open.length===1?pitch*2.2:pitch*0.75, by=blockPos(0).y;
  let best=-1, bd=1e9;
  for(const i of open){ const dx=Math.abs(x-wx(i)), dy=y-by; if(dx<reach&&dy>-B*2.2&&dy<B*2.2&&dx<bd){ bd=dx; best=i; } }
  return best;
}
function placeOn(cd,wi,fly){
  train.wagons[wi].res=true; const p=blockPos(wi);
  animate(cd,p.x,p.y,S,fly?0.45:0.12,fly?B*1.2:0,()=>judge(cd,wi));
}
function judge(cd,wi){
  const w=train.wagons[wi]; w.res=false;
  if(train.st!=='wait'){ goHome(cd,false); return; }
  if(same(cd.it,w.need)){
    w.it=cd.it; cd.st='gone'; w.bounce=1; if(selected===cd) selected=null; gapMist=0;
    SFX.clack(); xylo(NOTES[elemIdx(cd.it)],0.04);
    const p=blockPos(wi); sparks(p.x,p.y,12,1);
    if(train.wagons.every(w=>w.it)) complete();
  } else {
    SFX.tok(); w.shake=1; chips(blockPos(wi).x,blockPos(wi).y+S*0.4,6);
    train.mist++; slips++; gapMist++; if(selected===cd) selected=null;
    goHome(cd,true);
  }
}
function complete(){
  const tr=train; tr.st='done'; tr.t=0; tr.step=-1; hint=null; selected=null;
  if(drag){ drag=null; }
  for(const cd of cands) if(cd.st!=='gone'){ cd.st='in'; cd.anim=null; cd.out=Math.max(cd.out,0.001); }
  SFX.choo();
  if(tr.mist===0) clean++;
  if(slips>=3){ level=Math.max(1,level-1); slips=0; clean=0; }
  else if(clean>=3&&level<6){ level++; clean=0; slips=0; }
}
function giveHint(){ if(train&&train.st==='wait'){ hint={t:0,step:-1}; } }

/* ---------- particles ---------- */
let parts=[];
function puff(x,y,r,vx){ parts.push({k:'smoke',x,y,vx:vx+rand(-8,8),vy:-rand(25,45),r,life:0,max:rand(1.3,1.9)}); }
function sparks(x,y,n,spread){ for(let i=0;i<n;i++){ const a=rand(0,P), v=rand(60,200)*spread; parts.push({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,r:rand(0.08,0.14)*B,rot:rand(0,P),life:0,max:rand(0.5,0.9),col:pick(['#ffe066','#fff4c2','#ffb3c1','#9fe3ff'])}); } }
function chips(x,y,n){ for(let i=0;i<n;i++) parts.push({k:'chip',x,y,vx:rand(-90,90),vy:rand(-160,-60),r:rand(0.03,0.06)*B,rot:rand(0,P),life:0,max:rand(0.5,0.8)}); }
function updateParts(dt){
  for(const p of parts){
    p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.k==='smoke'){ p.vx*=1-dt*0.8; p.vy*=1-dt*0.4; }
    else { p.vy+=500*dt; p.rot+=dt*6; }
  }
  parts=parts.filter(p=>p.life<p.max);
}
function drawParts(){
  for(const p of parts){
    const e=p.life/p.max;
    if(p.k==='smoke'){
      c.globalAlpha=(1-e)*0.9; c.fillStyle='#fdfbf6'; c.strokeStyle='rgba(95,80,75,0.6)'; c.lineWidth=Math.max(1.5,B*0.03);
      c.beginPath(); c.arc(p.x,p.y,p.r*(1+e*1.2),0,P); c.fill(); c.stroke();
    } else if(p.k==='spark'){
      c.globalAlpha=1-e; c.fillStyle=p.col; c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.beginPath();
      for(let i=0;i<8;i++){ const a=i*Math.PI/4, r=i%2?p.r*0.35:p.r; c.lineTo(Math.cos(a)*r,Math.sin(a)*r); }
      c.closePath(); c.fill(); c.restore();
    } else {
      c.globalAlpha=1-e; c.fillStyle='#e5bd84'; c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2); c.restore();
    }
  }
  c.globalAlpha=1;
}

/* ---------- update ---------- */
let started=false, t=0, blinkT=3;
function start(){ if(started) return; started=true; titleEl.classList.add('gone'); ac(); idle=0; }
function updateTrain(dt){
  const tr=train, px=tr.x;
  tr.t+=dt;
  if(tr.st==='arrive'){
    const e=Math.min(1,tr.t/2.6); tr.x=lerp(tr.xs,xStop(),easeOut(e));
    if(e>=1){ tr.st='wait'; tr.t=0; SFX.hiss(); cands.forEach((cd,i)=>{ cd.appear=-0.25-i*0.12; }); }
  } else if(tr.st==='wait'){
    tr.x=xStop();
  } else if(tr.st==='done'){
    tr.x=xStop();
    const T0=0.8, gap=0.22, step=Math.floor((tr.t-T0)/gap);
    while(tr.step<step&&tr.step<tr.N-1){ tr.step++; const w=tr.wagons[tr.step]; w.bounce=1; w.glow=1; xylo(NOTES[elemIdx(w.it)]); }
    const end=T0+tr.N*gap;
    if(!tr.tada&&tr.t>end+0.05){ tr.tada=true; SFX.tada(); for(let i=0;i<tr.N;i++){ const p=blockPos(i); sparks(p.x,p.y,5,0.8); } }
    if(tr.t>end+0.6){ tr.st='leave'; tr.v=0; SFX.toot(); }
  } else if(tr.st==='leave'){
    tr.v=Math.min(tr.v+W*0.8*dt,W*1.1); tr.x+=tr.v*dt;
    if(tr.x>W+40){ newTrain(); return; }
  }
  // chuff + smoke while moving; a lazy puff now and then while standing
  const dx=Math.abs(tr.x-px), lx=locoX()+B*1.22, ly=trackY-B*1.45;
  tr.dist+=dx;
  if(dx>0&&tr.dist-tr.lastChuff>B*1.1){ tr.lastChuff=tr.dist; SFX.chuff(clamp(dx/dt/(W*0.6),0.3,1)); puff(lx,ly,B*0.16,-dx/dt*0.25-12); }
  if(dx===0){ tr.puffT-=dt; if(tr.puffT<0){ tr.puffT=rand(1.2,2.2); puff(lx,ly,B*0.1,-10); } }
}
function update(dt){
  t+=dt; idle+=dt;
  blinkT-=dt; if(blinkT<-0.14) blinkT=rand(2,5);
  updateTrain(dt);
  for(const w of train.wagons){ w.bounce=Math.max(0,w.bounce-dt*2.6); w.shake=Math.max(0,w.shake-dt*2.5); w.glow=Math.max(0,w.glow-dt*1.3); w.q=Math.max(0,w.q-dt*1.8); }
  for(const cd of cands){
    if(cd.appear<1&&cd.appear>-1e8){ const was=cd.appear; cd.appear+=dt*3; if(was<0&&cd.appear>=0) SFX.pop(cd.slot); }
    if(cd.out>0){ cd.out=Math.min(1,cd.out+dt*4); if(cd.out>=1) cd.st='gone'; }
    cd.wob=Math.max(0,cd.wob-dt*1.6);
    if(cd.st==='anim'){ const a=cd.anim; a.t+=dt; if(a.t>=a.dur){ a.t=a.dur; a.done(); if(cd.anim===a) cd.anim=null; } } // done() may start the next move from here
  }
  if(hint&&train.st==='wait'){
    hint.t+=dt; const s=Math.floor(hint.t/0.42);
    while(hint.step<s&&hint.step<train.N-1){
      hint.step++; const w=train.wagons[hint.step]; w.glow=1; w.bounce=0.7;
      if(w.it) xylo(NOTES[elemIdx(w.it)]); else { w.q=1; SFX.ask(); }
    }
    if(hint.step>=train.N-1&&hint.t>train.N*0.42+0.3) hint=null;
  } else hint=null;
  // a gentle nudge when nothing happens for a while: the empty wagon puffs up (no sound)
  if(train.st==='wait'&&started&&!drag&&idle>12){ idle=0; for(const w of train.wagons) if(!w.it) w.q=1; }
  hover=drag?findTarget(drag.x+drag.ox,drag.y+drag.oy):-1;
  if(drag&&drag.touch) drag.oy+=(-C*0.55-drag.oy)*Math.min(1,dt*10);
  updateParts(dt);
}

/* ---------- drawing ---------- */
function drawMat(){
  const y0=Math.min(trackY-B*2.2,lerp(trackY-B*2.2,90,0.45)), y1=Math.max(trackY+B*0.85,lerp(trackY+B*0.85,boxTop-24,0.45)), r=B*0.45;

  c.setLineDash([B*0.16,B*0.12]); c.strokeStyle='rgba(255,255,255,0.9)'; c.lineWidth=Math.max(2,B*0.04);

  c.restore();
  c.strokeStyle='rgba(70,35,10,0.55)'; c.lineWidth=Math.max(1.5,b*0.03); c.beginPath(); rrPath(X(0.14),Y(-1.2),b*0.38,b*0.34,b*0.07); c.stroke();
  wood(rr(X(-0.06),Y(-1.48),b*0.78,b*0.16,b*0.07),X(-0.06),Y(-1.48),b*0.78,b*0.16,L.roof,79);
  wood(circ(X(1.47),Y(-0.68),b*0.07),X(1.4),Y(-0.75),b*0.14,b*0.14,'#ffd84a',80,{worn:false});
  wood(rr(X(1.48),Y(-0.46),b*0.1,b*0.14,b*0.04),X(1.48),Y(-0.46),b*0.1,b*0.14,'#4a3a3f',81);
  // wheels (they don't bob) and the connecting rod between the front wheels
  const ws=[[0.34,0.26],[0.94,0.19],[1.27,0.19]];
  for(const [wxp,r] of ws) drawWheel(X(wxp),trackY-r*b,r*b,train.x/(r*b),'#8f5a2f');
  const a=train.x/(0.19*b), ox=Math.cos(a)*0.1*b, oy=Math.sin(a)*0.1*b;
  wood(rr(X(0.94)+ox-b*0.03,trackY-0.19*b+oy-b*0.03,b*0.39,b*0.06,b*0.03),X(0.9),trackY-0.25*b,b*0.45,b*0.1,'#c9c2b4',82,{worn:false,bev:b*0.01});
}
function drawTrain(){
  const tr=train, moving=tr.st==='arrive'||tr.st==='leave';
  const bob=moving&&!RM?Math.sin(tr.dist/B*3)*B*0.018:0;
  c.fillStyle='#5a3b22';
  for(let i=0;i<tr.N;i++){ const x=wx(i)+pitch*0.4, x2=i<tr.N-1?wx(i+1)-pitch*0.4:locoX()+B*0.05; c.fillRect(x,bedTop()+B*0.09+bob,x2-x,B*0.07); }
  for(let i=0;i<tr.N;i++) drawWagon(i,bob);
  drawLoco(locoX(),bob);
}
function drawBox(front){
  if(!front){
    wood(rr(trayX,boxTop,trayW,boxBot-boxTop,C*0.16),trayX,boxTop,trayW,boxBot-boxTop,'#a86f3c',21,{worn:false,grain:0.5,T:C*3,shadow:C*0.07});
    wood(rr(trayX,boxTop,trayW,C*0.13,C*0.06),trayX,boxTop,trayW,C*0.13,'#dcab6e',22,{worn:false,grain:0.5,T:C*3});
    c.fillStyle='rgba(40,15,0,0.22)'; c.fillRect(trayX+C*0.06,boxTop+C*0.13,trayW-C*0.12,C*0.1);
  } else {
    wood(rr(trayX-C*0.04,lipTop,trayW+C*0.08,boxBot-lipTop,C*0.14),trayX-C*0.04,lipTop,trayW+C*0.08,boxBot-lipTop,'#e6b777',23,{worn:false,grain:0.5,T:C*3});
    c.fillStyle='#d8432f'; c.beginPath(); rrPath(trayX+C*0.4,lipTop+C*0.17,trayW-C*0.8,C*0.08,C*0.04); c.fill();
    for(const px of [trayX+C*0.2,trayX+trayW-C*0.2]) wood(circ(px,(lipTop+boxBot)/2,C*0.08),px-C*0.08,lipTop,C*0.16,C*0.16,'#f2d7a6',24,{worn:false,grain:0.3});
  }
}
function drawCands(layer){
  for(const cd of cands){
    if(cd.st==='gone') continue;
    const top=cd.st!=='in';
    if(top!==layer) continue;
    const p=candPos(cd); if(p.s<1) continue;
    const kb=cd===selected;
    const help=gapMist>=2&&train.st==='wait'&&cd.st==='in'&&same(cd.it,firstNeed());
    drawBlock(cd.it,p.x,p.y,p.s,{rot:p.rot,lift:top?C*0.18:(kb?C*0.12:0),glow:kb?0.6+0.2*Math.sin(t*5):help?0.5:0});
  }
}
function draw(){
  c.setTransform(DPR,0,0,DPR,0,0);
  if(floorCv) c.drawImage(floorCv,0,0,W,H);
  drawMat();
  drawTrack();
  drawTrain();
  drawBox(false);
  drawCands(false);
  drawBox(true);
  drawParts();
  drawCands(true);
}

/* ---------- input ---------- */
function hitCand(x,y){
  if(!train||train.st!=='wait') return null;
  const p=(trayW-C*0.4)/cands.length;
  for(const cd of cands){ if(cd.st!=='in'||cd.appear<0.5||cd.out>0) continue; const h=homePos(cd); if(Math.abs(x-h.x)<p*0.5&&y>boxTop-C*0.45&&y<boxBot+10) return cd; }
  return null;
}
function hitWagon(x,y){
  if(!train||y<trackY-B*2||y>trackY+B*0.45) return -1;
  for(let i=0;i<train.N;i++) if(Math.abs(x-wx(i))<pitch*0.55) return i;
  return -1;
}
function tapAt(x,y){
  const wi=hitWagon(x,y);
  if(wi>=0){
    const w=train.wagons[wi];
    if(!w.it&&train.st==='wait'){ if(selected&&selected.st==='in'&&!w.res){ const cd=selected; selected=null; placeOn(cd,wi,true); } else giveHint(); return; }
    if(w.it){ w.bounce=1; w.glow=1; xylo(NOTES[elemIdx(w.it)]); return; }
  }
  const lx=locoX();
  if(x>lx&&x<lx+B*1.6&&y>trackY-B*1.8&&y<trackY+B*0.3){ SFX.toot(); puff(lx+B*1.22,trackY-B*1.45,B*0.16,-10); return; }
  selected=null; SFX.boop(); chips(x,y,4);
}
cv.addEventListener('pointerdown',e=>{
  idle=0;
  if(!started){ start(); return; }
  if(drag) return;
  const cd=hitCand(e.clientX,e.clientY);
  if(cd){
    const h=candPos(cd);
    drag={cd,id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,ox:h.x-e.clientX,oy:h.y-e.clientY,t0:performance.now(),moved:false,touch:e.pointerType!=='mouse'};
    cd.st='drag'; cd.wob=0; SFX.lift();
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    return;
  }
  tapAt(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId) return;
  drag.x=e.clientX; drag.y=e.clientY;
  if(Math.hypot(drag.x-drag.sx,drag.y-drag.sy)>12) drag.moved=true;
});
function endDrag(e,cancel){
  if(!drag||drag.id!==e.pointerId) return;
  const d=drag, cd=d.cd; idle=0;
  if(cd.st!=='drag'){ drag=null; return; }
  if(!cancel&&!d.moved&&performance.now()-d.t0<500){ // a tap picks the block up; tap the empty wagon to put it there
    drag=null; cd.st='in'; selected=selected===cd?null:cd; SFX.softClack(); return;
  }
  const wi=cancel?-1:findTarget(d.x+d.ox,d.y+d.oy);
  if(selected===cd) selected=null;
  if(wi>=0) placeOn(cd,wi,false); else goHome(cd,false); // these start from the drag position, so drag is cleared after
  drag=null;
}
cv.addEventListener('pointerup',e=>endDrag(e,false));
cv.addEventListener('pointercancel',e=>endDrag(e,true));
function availCands(){ return cands.filter(cd=>cd.st==='in'&&cd.appear>=0.5&&cd.out===0).sort((a,b)=>a.slot-b.slot); }
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!['arrowleft','arrowright','arrowup','arrowdown',' ','enter','a','d','w','h'].includes(k)) return;
  if(document.activeElement===soundBtn&&(k===' '||k==='enter')) return;
  e.preventDefault(); idle=0;
  if(!started){ start(); return; }
  if(e.repeat&&(k===' '||k==='enter')) return;
  if(!train||train.st!=='wait') return;
  const av=availCands();
  if(k==='arrowleft'||k==='arrowright'||k==='a'||k==='d'){
    if(!av.length) return;
    let i=av.indexOf(selected);
    if(i<0) i=(k==='arrowleft'||k==='a')?av.length-1:0;
    else i=(i+((k==='arrowleft'||k==='a')?-1:1)+av.length)%av.length;
    selected=av[i]; SFX.softClack();
  } else if(k==='arrowup'||k==='w'||k==='h'){ giveHint(); }
  else if(k===' '||k==='enter'||k==='arrowdown'){
    if(!selected||selected.st!=='in'){ if(av.length){ selected=av[0]; SFX.softClack(); } return; }
    const wi=train.wagons.findIndex(w=>!w.it&&!w.res);
    if(wi>=0){ const cd=selected; selected=null; placeOn(cd,wi,true); }
  }
});

const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5h3.5l5-4v13l-5-4H3.5z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5h3.5l5-4v13l-5-4H3.5z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
soundBtn.innerHTML=ICON_ON;
soundBtn.addEventListener('click',()=>{
  soundOn=!soundOn; soundBtn.innerHTML=soundOn?ICON_ON:ICON_OFF;
  soundBtn.setAttribute('aria-pressed',soundOn); soundBtn.setAttribute('aria-label',soundOn?'Geluid staat aan':'Geluid staat uit');
  out(); setMaster(soundOn); if(soundOn) SFX.toot();
});
document.addEventListener('visibilitychange',()=>setMaster(soundOn&&!document.hidden));

addEventListener('resize',resize); resize(); newTrain();
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
