<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Speelhoek</title>
<!-- installable web app: home-screen icon, full-screen launch, works offline (see sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speelhoek">
<meta name="theme-color" content="#ffcf4a">
<style id="fonts">__FONT_CSS__</style>
<style>
/* Layout: a sunny playroom wall with a shelf of big game boxes; a game opens full-screen with a round home button */
:root{
  --wall:#ffcf4a;
  --wall-dot:#ffc021;
  --ink:#3b2340;
  --card:#fff8ec;
  --accent:#ff7a59;
  --leaf:#3f8a4f;
  --font-display:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;
  color-scheme: light;
}
html,body{height:100%}
html{touch-action:manipulation}
body{margin:0;background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 3px,transparent 3.5px);background-size:30px 30px;color:var(--ink);font-family:var(--font-display);-webkit-tap-highlight-color:transparent}
body.playing{overflow:hidden}
[hidden]{display:none!important}
.home{min-height:100%;box-sizing:border-box;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:26px}
.brand{margin:0;font-size:clamp(46px,9vw,84px);font-weight:800;line-height:.95;letter-spacing:.005em;text-align:center;text-wrap:balance}
.brand span{color:var(--accent)}
.shelf{width:100%;max-width:900px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px}
.game{appearance:none;font:inherit;color:inherit;text-align:left;border:4px solid var(--ink);border-radius:24px;background:var(--card);padding:0;overflow:hidden;cursor:pointer;box-shadow:0 8px 0 var(--ink);display:flex;flex-direction:column;min-width:0;transition:transform .12s,box-shadow .12s}
.game:hover{transform:translateY(-3px);box-shadow:0 11px 0 var(--ink)}
.game:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
.game:focus-visible{outline:5px solid var(--accent);outline-offset:4px}
.game img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-bottom:4px solid var(--ink);background:#bfe3d6}
.label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 14px}
.label strong{min-width:0;overflow-wrap:break-word;font-size:clamp(24px,3.4vw,30px);font-weight:800;line-height:1.05}
.label strong.long{font-size:clamp(22px,2.6vw,26px)}
.play{flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);display:grid;place-items:center}
.play svg{width:20px;height:20px;margin-left:3px}
.player{position:fixed;inset:0;z-index:5;background:var(--ink)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.homebtn{position:fixed;z-index:6;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:52px;height:52px;border-radius:50%;border:3px solid var(--ink);background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.homebtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.homebtn:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.homebtn svg{width:28px;height:28px}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>

<main class="home" id="home">
  <h1 class="brand">Speel<span>hoek</span></h1>
  <div class="shelf" id="shelf"></div>
</main>
<div class="player" id="player" hidden></div>
<button class="homebtn" id="homebtn" type="button" aria-label="Terug naar de spelletjes" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M6 10v9.5h4.5v-5h3v5H18V10" fill="#ffcf4a"/></svg>
</button>

<script>
const GAMES = __GAMES__;
(() => {
  const home=document.getElementById('home'), shelf=document.getElementById('shelf'), player=document.getElementById('player'), homeBtn=document.getElementById('homebtn');
  const PLAY='<svg viewBox="0 0 20 20"><path d="M5 3.5v13l11-6.5z" fill="#fff8ec" stroke="#3b2340" stroke-width="2.4" stroke-linejoin="round"/></svg>';
  // Games are full HTML documents: pass them through, only injecting the embedded fonts
  // (so they also work offline) and the hub's extra CSS before </head>
  const FONTS=document.getElementById('fonts').textContent;
  const SHELL=(g)=>{
    const i=g.html.search(/<\/head>/i), css='<style>'+FONTS+g.css+'</style>';
    return i<0?css+g.html:g.html.slice(0,i)+css+g.html.slice(i);
  };

  // Kids pinch and double-tap by accident. On iOS that zooms the whole app (game included, and
  // iOS ignores user-scalable=no), and the games' touch-action:none then blocks pinching back out.
  // So block the gestures in the hub and in each game, and snap back to 100% when fingers lift.
  const VP=document.querySelector('meta[name=viewport]'), VP_BASE=VP.content;
  function unzoom(force){
    const vv=window.visualViewport; if(!force&&(!vv||vv.scale<1.01)) return;
    VP.content=VP_BASE+',minimum-scale=1'; setTimeout(()=>{VP.content=VP_BASE;},300);
  }
  function guard(doc){
    const stop=e=>e.preventDefault();
    ['gesturestart','gesturechange','gestureend'].forEach(t=>doc.addEventListener(t,stop,{passive:false}));
    doc.addEventListener('touchmove',e=>{if(e.touches.length>1) e.preventDefault();},{passive:false});
    doc.addEventListener('touchend',e=>{if(!e.touches.length) setTimeout(unzoom,250);},{passive:true});
  }
  guard(document);

  GAMES.forEach(g=>{
    const b=document.createElement('button'); b.type='button'; b.className='game'; b.setAttribute('aria-label','Speel '+g.title);
    b.innerHTML='<img alt="" src="'+g.cover+'"><span class="label"><strong'+(g.title.length>14?' class="long"':'')+'>'+g.title+'</strong><span class="play">'+PLAY+'</span></span>';
    b.addEventListener('click',()=>open(g.id)); shelf.appendChild(b);
  });

  function open(id){
    const g=GAMES.find(x=>x.id===id); if(!g) return;
    player.innerHTML=''; const f=document.createElement('iframe');
    f.title=g.title; f.setAttribute('allow','autoplay; fullscreen'); f.srcdoc=SHELL(g);
    f.addEventListener('load',()=>{try{guard(f.contentDocument); f.contentWindow.focus();}catch(e){}});
    player.appendChild(f); player.hidden=false; homeBtn.hidden=false; home.hidden=true; document.body.classList.add('playing');
    unzoom(true);
    try{history.replaceState(null,'','#'+id);}catch(e){}
  }
  function close(){
    player.innerHTML=''; player.hidden=true; homeBtn.hidden=true; home.hidden=false; document.body.classList.remove('playing');
    unzoom(true);
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  }
  homeBtn.addEventListener('click',close);
  addEventListener('keydown',e=>{if(e.key==='Escape'&&!player.hidden) close();});
  const start=(location.hash||'').slice(1); if(start) open(start);
  // keep a copy on the device so Speelhoek also opens without internet (only when served over http(s))
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
